<!DOCTYPE html>
<html>

<head>

    <title>Smart Food Redistribution System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center">

        <h1 class="text-success">
            🍱 Smart Food Redistribution System
        </h1>

        <p class="lead">
            Connecting Food Donors, NGOs and Volunteers
        </p>

    </div>

    <div class="row mt-5">

        <div class="col-md-4">

            <div class="card shadow text-center p-4">

                <h3>🧑 Donor</h3>

                <p>
                    Donate surplus food safely.
                </p>

                <a href="/donor_home"
                   class="btn btn-primary">

                    Continue

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center p-4">

                <h3>🏢 Receiver</h3>

                <p>
                    Accept and manage food donations.
                </p>

                <a href="/receiver_home"
                   class="btn btn-success">

                    Continue

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center p-4">

                <h3>🚚 Volunteer</h3>

                <p>
                    Collect and deliver food.
                </p>

                <a href="/volunteer_home"
                   class="btn btn-warning">

                    Continue

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
