<!DOCTYPE html>
<html>

<head>

<title>Accepted Donations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="card shadow p-4">

<h2 class="text-success mb-4">

Accepted Donations

</h2>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Food</th>
<th>Category</th>
<th>Quantity</th>
<th>Phone</th>
<th>Status</th>
<th>Assign Volunteer</th>

</tr>

</thead>

<tbody>

{% for donation in donations %}

<tr>

<td>{{ donation.donation_id }}</td>

<td>{{ donation.food_name }}</td>

<td>{{ donation.food_type }}</td>

<td>{{ donation.quantity }}</td>

<td>{{ donation.donor_phone }}</td>

<td>

<span class="badge bg-success">

Accepted

</span>

</td>

</tr>
<td>

<form action="/assign_volunteer/{{ donation.donation_id }}"
      method="POST">

<select
name="volunteer_id"
class="form-select"
required>

<option value="">
Select Volunteer
</option>

{% for volunteer in volunteers %}

<option value="{{ volunteer.volunteer_id }}">

{{ volunteer.name }}

</option>

{% endfor %}

</select>

<br>

<button
class="btn btn-primary btn-sm">

Assign

</button>

</form>

</td>

{% endfor %}

</tbody>

</table>

<a href="/receiver_dashboard"
   class="btn btn-primary">

Back

</a>

</div>

</div>

</body>

</html>
