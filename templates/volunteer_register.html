<!DOCTYPE html>
<html>

<head>

<title>Volunteer Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center text-primary">

Volunteer Registration

</h2>
<div class="mb-3">

      <a href="/" class="btn btn-secondary">

            ← Back

      </a>

</div>


<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
maxlength="10"
pattern="[0-9]{10}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
name="address"
class="form-control"></textarea>

</div>

<div class="mb-3">

<label>Vehicle</label>

<select
name="vehicle"
class="form-select">

<option>Bike</option>

<option>Car</option>

<option>Auto</option>

<option>Van</option>

<option>Bicycle</option>

</select>

</div>

<div class="mb-3">

<label>Maximum Pickup Distance (km)</label>

<input
type="number"
name="max_distance"
class="form-control">

</div>

<button
class="btn btn-primary w-100">

Register

</button>

</form>

</div>

</div>

</body>

</html>
